<app-add-post (postAdded)="onPostAdded()"></app-add-post>
<div *ngIf="editingPostId" class="card mt-3 mb-3 shadow border-warning">
  <div class="card-header bg-warning text-white">
    <h5 class="mb-0">
      <i class="fa fa-edit"></i> Edytuj post
    </h5>
  </div>
  <div class="card-body">
    <form>
      <div class="mb-3">
        <label class="form-label">Tytuł</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="editForm.title"
          name="editTitle">
      </div>

      <div class="mb-3">
        <label class="form-label">Treść</label>
        <textarea 
          class="form-control" 
          rows="4"
          [(ngModel)]="editForm.content"
          name="editContent"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">URL obrazka</label>
        <input 
          type="url" 
          class="form-control" 
          [(ngModel)]="editForm.image"
          name="editImage">
        
        <div *ngIf="editForm.image && editForm.image.trim().length > 0" class="mt-2">
          <small class="text-muted">Podgląd:</small>
          <img [src]="editForm.image" alt="preview" class="img-thumbnail mt-1" style="max-height: 150px;">
        </div>
      </div>

      <div class="d-flex gap-2">
        <button 
          type="button" 
          class="btn btn-primary"
          (click)="saveEditedPost()">
          <i class="fa fa-save"></i> Zapisz zmiany
        </button>
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="cancelEdit()">
          <i class="fa fa-times"></i> Anuluj
        </button>
      </div>
    </form>
  </div>
</div>

<div class="row" *ngIf="getDisplayedItems().length > 0">
  <div *ngFor="let item of getDisplayedItems()" class="col-md-6 col-lg-4 mb-4 d-flex">
    <app-blog-item 
      [image]="item.image" 
      [text]="item.content"
      [title]="item.title"
      [id]="item._id"
      [authorId]="item.author?._id"
      [category]="item.category"
      (editPost)="onEditPost($event)"
      (deletePost)="onDeletePost($event)">
    </app-blog-item>
  </div>
</div>

<div *ngIf="getFilteredItems().length === 0" class="alert alert-secondary text-center">
  <i class="fa fa-search"></i> Brak wyników dla "{{ filterText }}"
</div>

<app-pagination
  *ngIf="getFilteredItems().length > 0"
  [totalItems]="getFilteredItems().length"
  [itemsPerPage]="itemsPerPage"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)">
</app-pagination>
