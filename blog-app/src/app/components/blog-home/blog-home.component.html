<div class="blog-section">
  <div class="container py-5">
    <div class="blog-header text-center mb-5">
      <h1 class="display-4 fw-bold mb-3">
        <i class="fa fa-newspaper-o me-3"></i>
        Mój Blog
      </h1>
      <p class="lead text-muted">
        Odkryj ciekawe treści i dziel się swoimi myślami
      </p>
    </div>

    <div class="row mb-4">
      <div class="col-lg-8 mx-auto">
        <app-search-bar (name)="onFilterChange($event)"></app-search-bar>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <div class="category-filters d-flex flex-wrap gap-2 justify-content-center">
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'All'"
            (click)="filterByCategory('All')">
            <i class="fa fa-th-large me-2"></i>
            Wszystkie
          </button>
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'Technologia'"
            (click)="filterByCategory('Technologia')">
            Technologia
          </button>
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'Podróże'"
            (click)="filterByCategory('Podróże')">
            Podróże
          </button>
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'Jedzenie'"
            (click)="filterByCategory('Jedzenie')">
            Jedzenie
          </button>
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'Sport'"
            (click)="filterByCategory('Sport')">
            Sport
          </button>
          <button 
            class="btn btn-outline-dark"
            [class.active]="selectedCategory === 'Inne'"
            (click)="filterByCategory('Inne')">
            Inne
          </button>
        </div>
      </div>
    </div>

    <div class="actions-bar d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex gap-2">
        <button class="btn btn-info" (click)="toggleGallery()">
          <i class="fa fa-picture-o me-2"></i> 
          {{ showGallery ? 'Pokaż posty' : 'Pokaż galerię' }}
        </button>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-outline-dark" (click)="toggleTheme()">
          <i class="fa" [ngClass]="isDarkMode ? 'fa-sun-o' : 'fa-moon-o'"></i>
        </button>
        
        <a [routerLink]="['/favorites']" class="btn btn-outline-dark">
          <i class="fa fa-heart me-2"></i>
          Ulubione
          <span class="badge bg-dark text-white ms-2">{{ favoritesCount }}</span>
        </a>
      </div>
    </div>

    <app-blog *ngIf="!showGallery" [searchFilter]="searchText"></app-blog>
    <app-gallery *ngIf="showGallery"></app-gallery>
  </div>
</div>
